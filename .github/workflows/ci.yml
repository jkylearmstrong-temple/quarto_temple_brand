name: Quarto CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install LaTeX (TinyTeX)
        run: |
          sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-latex-recommended texlive-latex-extra
      - name: Quarto check
        run: quarto check
      - name: Render example document
        run: quarto render example.qmd
