name: Lua lint

on:
  push:
    paths:
      - _extensions/titlepage/**
      - tests/**
      - .luacheckrc
      - .github/workflows/lua-lint.yml
  pull_request:
    paths:
      - _extensions/titlepage/**
      - tests/**
      - .luacheckrc
      - .github/workflows/lua-lint.yml

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck and lua
        # Ubuntu packages luacheck as "lua-check" (the binary is still "luacheck").
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check lua5.4
      - name: Run luacheck
        run: luacheck _extensions/titlepage/*.lua
      - name: Run Lua filter tests
        env:
          LUA: lua5.4
        run: bash tests/run-lua-tests.sh
