title: Temple Brand
author: J. Kyle Armstrong
version: 1.1.0
quarto-required: ">=1.6.0"
contributes:
  # Applies brand.yml (colors, fonts, logo) to every document in the project.
  metadata:
    project:
      brand: brand.yml

  # Format defaults live here, not in brand.yml: Quarto only reads
  # `defaults.bootstrap` and `defaults.quarto` from a brand file, so
  # per-format keys there are silently ignored.
  formats:
    # format: temple-html
    html:
      toc: true
      toc-depth: 3
      number-sections: false
      code-tools: true
      df-print: paged
      fig-align: center
      cap-location: bottom

    # format: temple-typst (PDF without a LaTeX install)
    typst:
      toc: true
      number-sections: true
      margin:
        x: 1in
        y: 1in

    # format: temple-revealjs
    revealjs:
      transition: fade
      slide-number: true
      footer: >
        Center for Biostatistics & Epidemiology |
        Lewis Katz School of Medicine at Temple University

    # format: temple-pdf (LaTeX, nmfs-opensci/quarto_titlepages title page)
    # The titlepage extension ships alongside this one; the relative paths
    # hold whether it is installed as _extensions/<name> or
    # _extensions/<org>/<name>.
    pdf:
      filters:
        - ../titlepage/titlepage-theme.lua
        - ../titlepage/coverpage-theme.lua
      template-partials:
        - ../titlepage/_coverpage.tex
        - ../titlepage/_author-affiliation-themes.tex
        - ../titlepage/_header-footer-date-themes.tex
        - ../titlepage/_title-themes.tex
        - ../titlepage/_titlepage.tex
        - ../titlepage/before-body.tex
        - ../titlepage/pandoc.tex

      documentclass: scrartcl
      classoption: ["oneside", "open=any"]
      number-sections: true
      toc: true
      toc-depth: 3
      date-format: "MMM D, YYYY"
      # Links are conventional blue, not cherry: the Temple brand guide says
      # nothing about link color, and red links read as errors in print.
      colorlinks: true
      linkcolor: "templelinkblue"
      filecolor: "templelinkblue"
      citecolor: "templelinkblue"
      urlcolor: "templelinkblue"
      include-in-header:
        text: |
          \definecolor{templecherry}{HTML}{a41e35}
          \definecolor{templeNightOwl}{HTML}{005a70}
          \definecolor{templeBlack}{HTML}{000000}
          \definecolor{templeBookNook}{HTML}{fff2e8}
          \definecolor{templelinkblue}{HTML}{0563c1}
          % CBE address at left, Temple T at right, bottoms aligned.
          \newcommand{\templefooterlogo}{%
            \noindent\begin{minipage}[b]{0.72\linewidth}\footerblock\end{minipage}%
            \hfill\begin{minipage}[b]{0.24\linewidth}\raggedleft\logoblock\end{minipage}}

      # bg-image theme: cherry corner with the Temple T at upper left,
      # CBE mailing address and Temple T at the bottom.
      titlepage: "bg-image"
      titlepage-bg-image: "temple-corner.png"
      titlepage-logo: "Temple_T_logo.png"
      titlepage-geometry: ["top=3in", "bottom=1in", "right=1in", "left=1in"]
      titlepage-footer: |
        Center for Biostatistics & Epidemiology\
        Lewis Katz School of Medicine at Temple University\
        3401 N. Broad Street, 3rd Floor Kresge\
        Philadelphia, PA 19140
      titlepage-theme:
        # Single quotes: YAML treats backslashes in them literally.
        elements:
          - '\titleblock'
          - '\dateblock'
          - '\authorblock'
          - '\affiliationblock'
          - '\vfill'
          - '\templefooterlogo'
        logo-size: '\linewidth'
        logo-space-after: "0pt"
        bg-image-size: '0.5\paperwidth'
        bg-image-location: "ULCorner"
        page-html-color: "ffffff"
        page-text-align: left
        page-fontfamily: "Latin Modern Sans"
        vrule-width: "2pt"
        vrule-color: "templecherry"
        vrule-align: left
        vrule-space: "18pt"
        title-style: plain
        title-color: "templecherry"
        title-fontsize: 22
        title-spacing: 27
        title-fontstyle: ["bfseries"]
        title-align: left
        title-space-after: '1\baselineskip'
        subtitle-style: plain
        subtitle-color: "templeBlack"
        subtitle-fontsize: 14
        subtitle-spacing: 18
        subtitle-fontstyle: ["textit"]
        subtitle-align: left
        author-style: "superscript-with-and"
        author-fontsize: 12
        author-spacing: 16
        author-align: left
        author-space-after: '2\baselineskip'
        affiliation-style: "numbered-list-with-correspondence"
        affiliation-fontsize: 11
        affiliation-spacing: 14
        affiliation-align: left
        affiliation-space-after: '1\baselineskip'
        date-style: plain
        date-fontsize: 11
        date-spacing: 14
        date-fontstyle: ["textit"]
        date-align: right
        date-space-after: '1\baselineskip'
        footer-style: plain
        footer-fontsize: 11
        footer-spacing: 14
        footer-align: left
        footer-space-after: "1pt"
