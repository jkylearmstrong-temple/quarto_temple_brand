meta:
  name:
    full: Center for Biostatistics & Epidemiology
    short: CBE
  description: >
    Center for Biostatistics & Epidemiology,
    Department of Biomedical Education and Data Science,
    Lewis Katz School of Medicine at Temple University
  link: https://medicine.temple.edu/research/research-centers/center-biostatistics-epidemiology

color:
  palette:
    # Temple primary colors
    cherry:    "#a41e35"
    black:     "#1d1d1d"
    white:     "#ffffff"
    # Temple secondary colors
    taupe:     "#baa682"
    icy-blue:  "#cbf6ff"
    lime:      "#c7d703"
    eggshell:  "#f2eee8"
    ochre:     "#fdb913"
    geranium:  "#e7201d"
    dark-blue: "#21287e"

  # Semantic role assignments
  foreground:   "#1d1d1d"
  background:   "#ffffff"
  primary:      "#a41e35"
  secondary:    "#21287e"
  tertiary:     "#baa682"
  success:      "#c7d703"
  info:         "#cbf6ff"
  warning:      "#fdb913"
  danger:       "#e7201d"
  light:        "#f2eee8"
  dark:         "#1d1d1d"

typography:
  # Temple uses ITC Franklin Gothic and similar sans-serif families.
  # These Google Fonts are close open-source alternatives.
  fonts:
    - family: "Source Sans 3"
      source: google
    - family: "Source Serif 4"
      source: google
    - family: "JetBrains Mono"
      source: google

  base:
    family: "Source Sans 3"
    size: 1rem
    weight: 400
    line-height: 1.6

  headings:
    family: "Source Sans 3"
    weight: 700
    color: "#a41e35"
    line-height: 1.2

  monospace:
    family: "JetBrains Mono"
    size: 0.9em

  monospace-inline:
    family: "JetBrains Mono"
    background-color: "#f2eee8"

  link:
    color: "#a41e35"
    decoration: underline

  # Code block background echoes eggshell (light) brand color
  monospace-block:
    family: "JetBrains Mono"
    background-color: "#f2eee8"
    color: "#1d1d1d"

defaults:
  # HTML / Quarto document defaults
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    theme:
      # Use Quarto's lumen base and override with brand colors
      - lumen
    code-fold: false
    code-tools: true
    df-print: paged
    fig-align: center
    cap-location: bottom

  # PDF / LaTeX defaults
  pdf:
    documentclass: article
    geometry:
      - top=1in
      - left=1in
      - right=1in
      - bottom=1in
    toc: false
    number-sections: true
    colorlinks: true
    linkcolor: "a41e35"
    urlcolor: "a41e35"

  # Revealjs presentation defaults
  revealjs:
    theme: simple
    transition: fade
    slide-number: true
    footer: >
      Center for Biostatistics & Epidemiology |
      Lewis Katz School of Medicine at Temple University

  # titlepage-pdf (quarto_titlepages extension)
  # Install via: quarto install extension nmfs-opensci/quarto_titlepages
  titlepage-pdf:
    documentclass: scrartcl
    classoption: ["oneside", "open=any"]
    number-sections: true
    toc: true
    toc-depth: 3
    colorlinks: true
    linkcolor: "a41e35"
    urlcolor: "a41e35"

    # --- Title page ---
    titlepage: "vline"
    titlepage-logo: "Temple_T_logo.png"
    titlepage-header: |
      Lewis Katz School of Medicine at Temple University\
      Department of Biomedical Education and Data Science
    titlepage-footer: |
      Center for Biostatistics & Epidemiology\
      https://medicine.temple.edu/research/research-centers/center-biostatistics-epidemiology

    # Define Temple Cherry for use in titlepage-theme
    include-in-header:
      text: |
        \definecolor{templecherry}{HTML}{a41e35}
        \definecolor{templeDarkBlue}{HTML}{21287e}
        \definecolor{templeBlack}{HTML}{1d1d1d}
        \definecolor{templeEggshell}{HTML}{f2eee8}

    titlepage-theme:
      # Layout: logo top-left, then title, vfill, author, affiliation, date at bottom
      elements:
        - "\\logoblock"
        - "\\headerblock"
        - "\\vfill"
        - "\\titleblock"
        - "\\subtitleblock"
        - "\\vfill"
        - "\\authorblock"
        - "\\affiliationblock"
        - "\\dateblock"
        - "\\footerblock"

      # Page background
      page-html-color: "ffffff"
      page-text-align: left
      page-fontfamily: "Latin Modern Sans"

      # Vertical rule — Temple Cherry, left-aligned
      vrule-width: "6pt"
      vrule-color: "templecherry"
      vrule-align: left
      vrule-space-after: "18pt"

      # Title
      title-style: plain
      title-color: "templecherry"
      title-fontsize: 28
      title-spacing: 34
      title-fontstyle: ["bfseries"]
      title-align: left
      title-space-after: "0.15in"

      # Subtitle
      subtitle-style: plain
      subtitle-color: "templeBlack"
      subtitle-fontsize: 16
      subtitle-spacing: 20
      subtitle-fontstyle: ["textit"]
      subtitle-align: left
      subtitle-space-after: "0.1in"

      # Author
      author-style: "superscript"
      author-fontsize: 12
      author-spacing: 16
      author-align: left
      author-space-after: "0.05in"

      # Affiliation
      affiliation-style: "numbered-list"
      affiliation-fontsize: 10
      affiliation-spacing: 14
      affiliation-align: left
      affiliation-space-after: "0.1in"

      # Date
      date-style: plain
      date-fontsize: 10
      date-spacing: 14
      date-fontstyle: ["textit"]
      date-align: left
      date-space-after: "0.15in"

      # Header (institution line at top)
      header-style: plain
      header-fontsize: 10
      header-spacing: 14
      header-align: left
      header-space-after: "0.5in"

      # Footer (center URL line at bottom)
      footer-style: plain
      footer-fontsize: 9
      footer-spacing: 12
      footer-align: left
      footer-space-after: "0in"

      # Logo
      logo-size: 0.12
      logo-align: left
      logo-space-after: "0.3in"

logo:
  medium: "Temple_T_logo.png"
